<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <p>Daily meals and health tracking.</p>
</html>
<body>
    <header>
        <h1>Cat Nutrition Tracker</h1>
    </header>

    <main>
        <section class="card">
            <h2>Tonight's Dinner</h2>
            <p>Annie: Chicken</p>
            <p>Gus: Chicken</p>
        </section>
        <section class="card">
        <h2>Weight Tracking</h2>
        <p>Annie: 9.3 lb</p>
        <p>Gus: 10.5 lb</p>
        </section>
    </main>

    <nav>
        <button>Tonight</button>
        <button>History</button>
        <button>Weights</button>
        <button>Products</button>
        <button>Settings</button>
  </nav>

</body>
</html>
